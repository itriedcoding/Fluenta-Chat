[package]
name = "fluenta"
version = "1.2.0"
description = "Fluenta — a custom Discord client"
authors = ["Fluenta"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fluenta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
