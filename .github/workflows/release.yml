name: Release

# Builds the mod installer for Windows plus the mod bundles, and publishes them
# to the Releases page. Runs on every push to main so the updater in the mod and
# the installer always point at current binaries.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mod:build
      - name: Package Windows installer
        run: node tools/build-sea.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          if-no-files-found: error
          path: release/*.exe

  mod:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mod:typecheck
      - run: npm run mod:test
      - name: Package mod bundles
        run: |
          mkdir -p release-artifacts
          cp mod/dist/desktop.js mod/dist/renderer.js mod/dist/cli.cjs release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          if-no-files-found: error
          path: release-artifacts/*

  publish:
    needs: [version, installer, mod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-artifacts
          find artifacts -type f -exec cp {} release-artifacts/ \;
          ls -l release-artifacts
      - name: Remove releases that shipped the old standalone client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "v${{ needs.version.outputs.value }}" ]; then
              echo "Deleting stale release $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: Fluenta mod v${{ needs.version.outputs.value }}
          body: |
            Fluenta is a Discord client mod — run `Fluenta-Mod-Setup.exe`, pick
            install, then restart Discord. No account token or bot token needed.

            - **Windows**: `Fluenta-Mod-Setup.exe` (interactive) — also accepts
              `install`, `uninstall`, `update`, `status` arguments.
            - **Manual install**: `desktop.js` + `renderer.js` + `cli.cjs` next to
              `mod/dist/`, then `node cli.cjs install`.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
