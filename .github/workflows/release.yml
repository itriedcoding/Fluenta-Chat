name: Release

# Builds the mod installer for Windows plus the mod bundles, and publishes them
# to the Releases page. Runs on every push to main so the updater in the mod and
# the installer always point at current binaries.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mod:build
      - name: Package Windows installer
        run: node tools/build-sea.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          if-no-files-found: error
          path: release/*.exe

  mod:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mod:typecheck
      - run: npm run mod:test
      - name: Package mod bundles
        run: |
          mkdir -p release-artifacts
          cp mod/dist/desktop.js mod/dist/renderer.js mod/dist/cli.cjs release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          if-no-files-found: error
          path: release-artifacts/*

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mod:build
      - name: Build mod bundle for Android
        run: cp mod/dist/renderer.js android-mod/app/src/main/assets/fluenta.js
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          if [ -d "$ANDROID_HOME" ]; then SDK="$ANDROID_HOME"; fi
          mkdir -p "$SDK"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mkdir -p "$SDK/cmdline-tools"
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > android-mod/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android-mod
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p release-artifacts
          cp android-mod/app/build/outputs/apk/debug/app-debug.apk \
             "release-artifacts/Fluenta-${{ needs.version.outputs.value }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: release-artifacts/*.apk

  publish:
    needs: [version, installer, mod, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-artifacts
          find artifacts -type f -exec cp {} release-artifacts/ \;
          ls -l release-artifacts
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: v${{ needs.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Keeping $CURRENT, pruning everything older"
          ids=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name != env.CURRENT) | .id")
          for id in $ids; do
            echo "Deleting release id $id"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          tags=$(gh api "repos/$REPO/git/refs/tags" --jq '.[].ref' | sed 's#refs/tags/##' | grep -v "^${CURRENT}$" || true)
          for tag in $tags; do
            echo "Deleting tag $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: Fluenta mod v${{ needs.version.outputs.value }}
          body: |
            Fluenta is a Discord client mod — run `Fluenta-Mod-Setup.exe`, pick
            install, then restart Discord. No account token or bot token needed.

            - **Windows**: `Fluenta-Mod-Setup.exe` (interactive) — also accepts
              `install`, `uninstall`, `update`, `status` arguments. It patches the
              Discord you already have installed.
            - **Android**: `Fluenta-<version>-android.apk` — sideload it, sign in
              normally. It runs Discord's web client with the same mod bundle
              injected (Discord's native app is Hermes bytecode and cannot take a
              JS mod without root/LSPosed, so it is not used).
            - **Manual install**: `desktop.js` + `renderer.js` + `cli.cjs` next to
              `mod/dist/`, then `node cli.cjs install`.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
